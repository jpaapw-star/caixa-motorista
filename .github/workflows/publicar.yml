# Robô do Caixa do Motorista.
# - Toda vez que você muda um arquivo: testa o app e, se passar, publica no GitHub Pages.
# - Toda terça à noite e quinta de manhã: baixa o preço médio dos combustíveis da ANP, testa e publica.
# Se algo der errado, o GitHub manda um e-mail para você.
name: Testar e publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 21 * * 2" # terça, 18h30 de Brasília (a ANP costuma publicar a semana nova na terça)
    - cron: "30 12 * * 4" # quinta, 9h30 de Brasília (segunda tentativa)
  workflow_dispatch: # botão "Run workflow" na aba Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  anp:
    name: Preços da ANP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5
      - name: Baixar a pesquisa semanal da ANP
        run: python anp.py
      - name: Guardar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then
            echo "Nada novo na ANP."
          else
            git commit -m "Preços da ANP: $(date +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

  android:
    name: Testes no Android (Chrome)
    needs: anp
    if: ${{ !cancelled() }} # mesmo se a ANP falhar, o app é testado e publicado com os preços anteriores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Montar o app
        run: python build.py
      - name: Preparar os testes
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Testar
        run: npx playwright test --project=android
      - name: Guardar o relatório (só quando falha)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-android
          path: |
            relatorio-dos-testes
            test-results
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  iphone:
    name: Testes no iPhone (Safari)
    needs: anp
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Montar o app
        run: python build.py
      - name: Preparar os testes
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps webkit
      - name: Testar
        run: npx playwright test --project=iphone
      - name: Guardar o relatório (só quando falha)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-iphone
          path: |
            relatorio-dos-testes
            test-results
          retention-days: 7

  publicar:
    name: Publicar no GitHub Pages
    # Por enquanto só o teste do Android segura a publicação; o do iPhone avisa por e-mail se falhar.
    # Para o do iPhone também segurar, troque as duas linhas abaixo por:
    #   needs: [android, iphone]
    #   if: ${{ !cancelled() && needs.android.result == 'success' && needs.iphone.result == 'success' }}
    needs: android
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v5
